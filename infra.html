<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INFRA — Fluxo Operacional</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#090A0D;--surface:#0F1117;--card:#151820;--border:#1E2130;
  --gold:#F5B800;--gold-dim:rgba(245,184,0,.12);--gold-b:rgba(245,184,0,.28);
  --txt:#E8EAF0;--txt-dim:#6B7280;--txt-mid:#9CA3AF;
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;--r:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow:hidden;}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;}
.tb-logo{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap;}
.tb-sep{color:var(--border);font-size:18px;}
.tb-sw{position:relative;flex:1;max-width:280px;}
.tb-s{width:100%;background:var(--card);border:1px solid var(--border);border-radius:7px;
  color:var(--txt);font-size:12px;padding:6px 10px 6px 30px;outline:none;font-family:'DM Sans',sans-serif;}
.tb-s:focus{border-color:var(--gold);}
.tb-si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--txt-dim);font-size:13px;pointer-events:none;}
.tb-f{background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--txt);font-size:11px;padding:5px 9px;outline:none;font-family:'DM Sans',sans-serif;}
.tb-f:focus{border-color:var(--gold);}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:7px;}
.bsm{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--txt-dim);
  padding:5px 10px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:all .15s;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.bsm:hover{border-color:var(--gold);color:var(--gold);}
.board-wrap{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;height:calc(100vh - 52px);padding:12px;gap:10px;}
.board-wrap::-webkit-scrollbar{height:10px;}
.board-wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:5px;}
.board-wrap::-webkit-scrollbar-thumb{background:#4B5160;border-radius:5px;border:2px solid var(--bg);}
.board-wrap::-webkit-scrollbar-thumb:hover{background:#6B7280;}
.col{min-width:268px;max-width:268px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;transition:border-color .15s,background .15s;}
.col.dov{border-color:var(--gold);background:rgba(245,184,0,.05);}
.col-hd{padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-shrink:0;}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-nm{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt);flex:1;}
.col-ct{font-size:10px;color:var(--txt-dim);background:var(--card);padding:2px 7px;border-radius:10px;font-weight:600;}
.badd{background:none;border:none;color:var(--txt-dim);cursor:pointer;font-size:16px;padding:1px;transition:color .15s;display:flex;align-items:center;}
.badd:hover{color:var(--gold);}
.col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:60px;}
.col-body::-webkit-scrollbar{width:3px;}
.col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.resumo-col{flex:1;min-width:260px;align-self:flex-start;display:flex;flex-direction:column;gap:12px;}
.resumo{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;}
.resumo-ttl{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-dim);}
.resumo-hero{background:var(--gold-dim);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.resumo-hero .n{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;color:var(--txt);line-height:1.15;}
.resumo-hero .lbl{font-size:11px;color:var(--txt-dim);margin-top:4px;}
.resumo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.resumo-kpi{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--border);
  border-radius:8px;padding:10px 12px;}
.resumo-kpi.warn{border-left-color:var(--gold);}
.resumo-kpi .n{font-family:'DM Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;color:var(--txt);}
.resumo-chart{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
.resumo-chart-tip{display:none;position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--border);
  border-radius:6px;padding:5px 9px;font-size:11px;color:var(--txt);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2;}
.resumo-chart-tip b{font-variant-numeric:tabular-nums;}
.resumo-kpi.warn .n{color:var(--gold);}
.resumo-kpi .lbl{font-size:10.5px;color:var(--txt-mid);margin-top:2px;}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;cursor:grab;transition:all .15s;border-left:3px solid transparent;user-select:none;}
.kcard:hover{border-color:rgba(245,184,0,.3);border-left-color:var(--gold);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.4);}
.kcard.dragging{opacity:.35;cursor:grabbing;}
.kcard.hidden{display:none;}
.kcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:4px;}
.kcard-code{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.05em;}
.kcard-acomp{font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(139,92,246,.15);
  color:#A78BFA;border:1px solid rgba(139,92,246,.3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kcard-cli{font-size:11px;color:var(--txt);font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kcard-route{font-size:10px;color:var(--txt-dim);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kcard-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ktag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap;}
.tg{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-b);}
.tb{background:rgba(59,130,246,.1);color:#3B82F6;border:1px solid rgba(59,130,246,.3);}
.tp{background:rgba(139,92,246,.1);color:#8B5CF6;border:1px solid rgba(139,92,246,.3);}
.kav{width:18px;height:18px;border-radius:4px;background:var(--gold);display:flex;align-items:center;
  justify-content:center;font-size:8px;font-weight:800;color:#111;flex-shrink:0;margin-left:auto;font-family:'Syne',sans-serif;}
/* MODAL */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;
  backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;overflow-y:auto;padding:14px;}
.mov.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:780px;max-width:100%;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.7);overflow:hidden;}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid var(--border);}
.mhl{display:flex;align-items:center;gap:10px;}
.mttl{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--txt);}
.mcod{font-size:12px;color:var(--gold);font-weight:700;background:var(--gold-dim);padding:3px 9px;border-radius:5px;border:1px solid var(--gold-b);}
.mclose{background:none;border:none;color:var(--txt-dim);cursor:pointer;font-size:18px;display:flex;align-items:center;}
.mclose:hover{color:var(--txt);}
.mbody{padding:16px 20px;overflow-y:auto;max-height:72vh;}
.fsec{margin-bottom:16px;}
.fst{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  margin-bottom:9px;display:flex;align-items:center;gap:6px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.fg-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg.full{grid-column:1/-1;}
.fg.sp2{grid-column:span 2;}
.fg label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-dim);}
.fg input,.fg select,.fg textarea{background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--txt);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 9px;outline:none;transition:border-color .15s;}
.fg input[type="date"]{color-scheme:dark;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold);}
.fg select option{background:var(--card);}
.cod-ok{font-size:10px;color:var(--green);margin-top:3px;display:flex;align-items:center;gap:3px;}
.cod-err{font-size:10px;color:var(--red);margin-top:3px;display:none;align-items:center;gap:3px;font-weight:600;}
.cod-inp-dup{border-color:var(--red)!important;}.vw{position:relative;}
.vw input{width:100%;}
.vdrop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--gold-b);
  border-radius:6px;z-index:20;max-height:130px;overflow-y:auto;display:none;margin-top:2px;box-shadow:0 4px 12px rgba(0,0,0,.4);}
.vdrop.open{display:block;}
.vitem{padding:7px 10px;font-size:12px;cursor:pointer;color:var(--txt);}
.vitem:hover{background:var(--gold-dim);color:var(--gold);}
.pct-w{position:relative;}
.pct-w input{padding-right:26px;}
.pct-s{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--txt-dim);pointer-events:none;}
.az{border:2px dashed var(--border);border-radius:8px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;margin-top:4px;}
.az:hover,.az.dov{border-color:var(--gold);background:var(--gold-dim);}
.az p{font-size:11px;color:var(--txt-dim);margin-top:4px;}
.alist{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
.aitem{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;}
.aname{flex:1;font-size:11px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.asz{font-size:10px;color:var(--txt-dim);flex-shrink:0;}
.adl,.arm{background:none;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;flex-shrink:0;}
.adl{color:var(--gold);}
.arm{color:var(--red);}
.mft{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.bprim{background:var(--gold);color:#111;border:none;border-radius:7px;padding:9px 18px;font-size:12px;
  font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s;}
.bprim:hover{opacity:.85;}
.bprim:disabled{opacity:.4;cursor:default;}
.bgh{background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--txt-dim);
  padding:9px 13px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;}
.bgh:hover{border-color:var(--txt-dim);color:var(--txt);}
.bdng{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:7px;color:var(--red);
  padding:9px 12px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px;}
.bdng:hover{background:rgba(239,68,68,.2);}
.mmsg{font-size:11px;color:var(--green);}
.mmsg.err{color:var(--red);}
.cfg-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:440px;
  max-width:95vw;margin:auto;padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.6);}
.cfg-box h3{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:13px;color:var(--txt);}
.cfgr label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-dim);display:block;margin-bottom:4px;}
.cfgr input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--txt);font-size:12px;padding:7px 9px;outline:none;margin-bottom:10px;font-family:'DM Sans',sans-serif;}
.cfgr input:focus{border-color:var(--gold);}
.spinner{width:14px;height:14px;border:2px solid rgba(245,184,0,.2);border-top-color:var(--gold);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.prev-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;align-items:center;justify-content:center;padding:16px;}
.prev-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:min(860px,96vw);max-height:92vh;overflow:hidden;display:flex;flex-direction:column;}
.prev-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.prev-hd span{font-size:12px;font-weight:600;color:var(--txt);}
.prev-body{flex:1;overflow:auto;padding:12px;display:flex;align-items:center;justify-content:center;min-height:200px;}
.empty-col{font-size:11px;color:var(--txt-dim);text-align:center;padding:16px 0;opacity:.5;}
</style>

<style>
/* ── TEMA CLARO ─────────────────────────────────────── */
body.tema-claro{--bg:#F0F2F5;--surface:#FFFFFF;--card:#FFFFFF;--card-hover:#F5F7FA;--border:#E2E6ED;--border-light:#EEF1F6;--txt:#111827;--txt-dim:#6B7280;--txt-muted:#9CA3AF;--gold:#D97706;--green:#059669;--blue:#2563EB;--teal:#0D9488;--orange:#EA580C;--red:#DC2626;--purple:#7C3AED;--gold-dim:rgba(217,119,6,.10);}
/* Topbar — fundo cinza claro como na gestão de frota, texto preto */
body.tema-claro .topbar,body.tema-claro .top-bar,body.tema-claro [class*="topbar"],body.tema-claro .tb,body.tema-claro header{background:#F8FAFC!important;border-bottom-color:#E2E8F0!important;}
body.tema-claro .topbar *,body.tema-claro [class*="topbar"] *,body.tema-claro .tb *,body.tema-claro header *{color:#111827!important;}
/* Título do card — preto, não azul */
body.tema-claro .kcard-cli{color:#111827!important;}
body.tema-claro .kcard{background:#FFFFFF!important;border-color:#E2E6ED!important;}
body.tema-claro .kcard:hover{border-color:rgba(217,119,6,.4)!important;}
body.tema-claro .col-header{background:#F5F7FA!important;border-color:#E2E6ED!important;}
body.tema-claro .col-body{background:#EEF1F6!important;}
body.tema-claro .kcard-route{color:#6B7280!important;}
/* Tag de tipo de veículo — vermelho no lugar do verde (pouco visível no claro) */
body.tema-claro .kcard-foot .ktag[style*="22C55E"]{
  background:rgba(220,38,38,.1)!important;
  color:#DC2626!important;
  border-color:rgba(220,38,38,.3)!important;
}
</style>
</head>
<body style="display:flex;flex-direction:column;">

<div class="topbar">
  <div class="tb-logo">INF</div>
  <span class="tb-sep">|</span>
  <div class="tb-sw">
    <i class="ti ti-search tb-si"></i>
    <input class="tb-s" id="tb-s" placeholder="Buscar código, cliente, motorista..." oninput="doFilter()">
  </div>
  <select class="tb-f" id="f-vend" onchange="doFilter()">
    <option value="">Todos os vendedores</option>
  </select>
  <div class="tb-r">

    <button class="bsm" id="btn-antigos" onclick="carregarTodosCards()" title="Carrega também os cards com Data da Coleta anterior a 2 meses atrás">
      <i class="ti ti-history" style="font-size:12px"></i> Ver mais antigos
    </button>
    <button class="bsm" id="btn-ref" onclick="loadData()">
      <i class="ti ti-refresh" style="font-size:12px"></i> Atualizar
    </button>
  </div>
</div>

<div class="board-wrap" id="board">
  <div style="margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--txt-dim);">
    <div class="spinner" style="width:24px;height:24px;border-width:3px;"></div>
    <span style="font-size:12px;">Carregando...</span>
  </div>
</div>

<div class="mov" id="card-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="mhd">
      <div class="mhl">
        <span class="mttl" id="mttl">Novo Card</span>
        <span class="mcod" id="mcod" style="display:none"></span>
      </div>
      <button class="mclose" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mbody" id="mbody"></div>
    <div class="mft">
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="bdng" id="btn-del" onclick="deleteCard()" style="display:none">
          <i class="ti ti-trash" style="font-size:12px"></i> Excluir
        </button>
        <button class="bgh" id="btn-baixar-tudo" onclick="baixarTodosAnexos()" style="display:none">
          <i class="ti ti-download" style="font-size:12px"></i> Baixar Todos
        </button>
        <span class="mmsg" id="mmsg"></span>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="bgh" onclick="closeModal()">Cancelar</button>
        <button class="bprim" id="btn-sv" onclick="saveCard()">
          <i class="ti ti-device-floppy" style="font-size:13px"></i> Salvar
        </button>
      </div>
    </div>
  </div>
</div>



<script>
var ABA="INFRA", PFX="S", SK="jira_url_INFRA", ATK="att_INF_", EXTK="extra_INF_";
var STATUS_LIST=["OPERACIONAL","COLETA","FATURADO","FINALIZADO"];
var SC={"OPERACIONAL":"#3B82F6","COLETA":"#F59E0B","FATURADO":"#F5B800","FINALIZADO":"#22C55E"};
var AO=["","EM ROTA DE COLETA","AGUARDANDO CARREGAMENTO","CARREGANDO","EM ROTA DE ENTREGA","DESCARREGANDO","CONCLUIDO","NECESSARIO TRANSBORDO","RETOMAR CONTRATAÇÃO","SEM CONTATO"];

// Field map: chave do dado → id do elemento HTML
// As chaves DEVEM bater exatamente com os cabeçalhos da planilha Google Sheets
var FM={
  // ── Campos que já existem na planilha (nomes exatos da linha 1)
  "Chave":          "fi_dt_codigo",   // coluna A — mesmo valor do DT CODIGO
  "Resumo":         "fi_resumo_hid",  // coluna B — gerado no saveCard, sem input
  "Responsável":    "fi_responsavel", // coluna C
  "Status":         "fi_status",      // coluna D
  "ACOMPANHAMENTO": "fi_acomp",       // coluna E
  "DATA DA COLETA": "fi_data_col",    // coluna F
  "CLIENTE":        "fi_cliente",     // coluna G
  "CONTATO CLIENTE":"fi_contato",     // coluna H
  "VENDEDOR":       "fi_vendedor",    // coluna I
  "DT CODIGO":      "fi_dt_codigo",   // coluna J
  "FRETE COBRADO":  "fi_fr_cli",      // coluna K  ← era "FRETE CLIENTE"
  "FRETE PAGO":     "fi_fr_mot",      // coluna L  ← era "FRETE MOTORISTA"
  "TIPO DE VEICULO":"fi_veiculo",     // coluna M
  "MOTORISTA":      "fi_motor",       // coluna N
  "GERENCIAMENTO":  "fi_gerenc",      // coluna O
  "PREVISÃO DE ENTREGA":"fi_prev_ent",// coluna P  ← era "PREVISAO DA ENTREGA"
  "DATA DA ENTREGA":"fi_data_ent",    // coluna Q
  "UF ORIGEM":      "fi_uf_orig",     // coluna R
  "CUSTO OPERACIONAL TOTAL":"fi_custo",// coluna S ← era "CUSTO TOTAL OPERACIONAL"

  // ── Campos extras do form que precisam de colunas na planilha
  "CNPJ TOMADOR":       "fi_cnpj_tom",
  "CTE":                "fi_cte",
  "MDF":                "fi_mdf",
  "NF":                 "fi_nf",
  "CIDADE ORIGEM":      "fi_cid_orig",
  "CIDADE DESTINO":     "fi_cid_dest",
  "UF DESTINO":         "fi_uf_dest",
  "ADIANTAMENTO":       "fi_adiant",
  "TITULAR DA CONTA":   "fi_titular",
  "TIPO CHAVE PIX":     "fi_tipo_pix",
  "CHAVE PIX":          "fi_pix",
  "BANCO":              "fi_banco",

// Date helpers: sheet = dd/MM/yyyy, input[type=date] = yyyy-MM-dd
function toBR_inv(s){
  if(!s)return "";
  // dd/MM/yyyy → yyyy-MM-dd
  var p=String(s).split("/");
  if(p.length===3&&p[2].length===4)return p[2]+"-"+p[1]+"-"+p[0];
  // already yyyy-MM-dd?
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  return "";
}
function fromDateInp(s){
  if(!s)return "";
  // yyyy-MM-dd → dd/MM/yyyy
  var p=String(s).split("-");
  if(p.length===3)return p[2]+"/"+p[1]+"/"+p[0];
  return s;
}

function getAuthToken()    { return localStorage.getItem('barretos_auth_token'); }
function getRefreshToken() { return localStorage.getItem('barretos_auth_refresh'); }

async function tentarRenovarToken() {
  var refresh = getRefreshToken();
  if (!refresh) return false;
  // Evita duas abas/telas tentarem renovar ao mesmo tempo: se alguem ja
  // renovou nos ultimos 5s, usa o token que ja foi salvo em vez de tentar
  // de novo com o refresh token antigo (ele so vale uma vez).
  var agora = Date.now();
  var ultimaRenovacao = parseInt(localStorage.getItem('barretos_auth_renovado_em') || '0', 10);
  if (agora - ultimaRenovacao < 5000) return !!getAuthToken();
  try {
    var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token: refresh }),
    });
    if (!r.ok) return false;
    var j = await r.json();
    localStorage.setItem('barretos_auth_token', j.access_token);
    localStorage.setItem('barretos_auth_refresh', j.refresh_token);
    localStorage.setItem('barretos_auth_renovado_em', String(Date.now()));
    return true;
  } catch (e) { return false; }
}

// Toda chamada à API (do card, não dos anexos) passa por aqui em vez de
// fetch() direto, pra sempre ir com o token de login e tentar renovar
// sozinho se ele já tiver expirado.
async function apiFetch(url, options) {
  options = options || {};
  var headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + getAuthToken() });
  var res = await fetch(url, Object.assign({}, options, { headers: headers }));
  if (res.status === 401) {
    if (await tentarRenovarToken()) {
      headers.Authorization = 'Bearer ' + getAuthToken();
      res = await fetch(url, Object.assign({}, options, { headers: headers }));
    }
    if (res.status === 401) {
      mostrarTelaSemAcesso();
      throw new Error('Sessão expirada');
    }
  }
  return res;
}

/* ── Nova tentativa automática quando o backend está ocupado ──
   O Kanban é o módulo com mais gente mexendo ao mesmo tempo — o Apps
   Script agora devolve {success:false, ocupado:true} em vez de ficar
   pendurado até travar (planilha ocupada por outra pessoa). Em vez de
   mostrar erro na hora, espera um pouco e tenta de novo sozinho — na
   prática, a maioria das vezes o usuário nem chega a perceber. */
async function fetchComTentativas_(url, options, maxTentativas, timeoutMs){
  maxTentativas = maxTentativas || 3;
  for(var tentativa = 1; tentativa <= maxTentativas; tentativa++){
    try{
      var res;
      if(timeoutMs){
        // Sem isso, um Apps Script "frio" (primeira chamada depois de um
        // tempo parado) podia deixar o fetch pendurado por bem mais tempo
        // do que o usuário espera, sem cair no catch/retry — parecia
        // travado em vez de dar erro e tentar de novo.
        var ctrl = new AbortController();
        var timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
        try{ res = await fetch(url, Object.assign({}, options, { signal: ctrl.signal })); }
        finally{ clearTimeout(timer); }
      } else {
        res = await fetch(url, options);
      }
      var json = await res.json();
      if(json && json.ocupado && tentativa < maxTentativas){
        await new Promise(function(r){ setTimeout(r, 2500); });
        continue;
      }
      return json;
    }catch(e){
      if(tentativa >= maxTentativas) throw e;
      await new Promise(function(r){ setTimeout(r, 2500); });
    }
  }
}

// Resumo do quadro — preenche o espaço que sobrou desde que as colunas
// "Aguardando Manifesto"/"Manifestos" saíram (ver automação Faturamento →
// Kanban). Em vez de virar mais uma coluna manual, mostra informação que
// já existia espalhada (valor em aberto, pendências) direto no quadro.
function parseValorBR_(s){
  if(s===null||s===undefined||s==="")return 0;
  var v=String(s).replace(/R\$\s*/g,"").trim();
  if(v.indexOf(",")!==-1)v=v.replace(/\./g,"").replace(",",".");
  var n=parseFloat(v);
  return isFinite(n)?n:0;
}
function fmtMoeda_(v){
  return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function dataAmanhaBR_(){
  var d=new Date();d.setDate(d.getDate()+1);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
}
function montarResumo_(cards){
  var abertos=cards.filter(function(c){return c["Status"]!=="FATURADO"&&c["Status"]!=="FINALIZADO";});
  var valorAberto=abertos.reduce(function(s,c){return s+parseValorBR_(c["FRETE COBRADO"]);},0);
  var semValePedagio=cards.filter(function(c){return c["DATA DA COLETA"]&&!c["VALE PEDAGIO"];}).length;
  var semDataColeta=cards.filter(function(c){return !c["DATA DA COLETA"];}).length;
  var coletaAmanha=cards.filter(function(c){return c["DATA DA COLETA"]===dataAmanhaBR_();}).length;

  return "<div class=\"resumo\">"+

    "<div class=\"resumo-kpi"+(semDataColeta?" warn":"")+"\"><div class=\"n\">"+semDataColeta+"</div><div class=\"lbl\">Sem Data de Coleta</div></div>"+
    "<div class=\"resumo-kpi\" style=\"grid-column:1/-1\"><div class=\"n\">"+coletaAmanha+"</div><div class=\"lbl\">Coleta amanhã</div></div>"+

var MESES_=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function fmtMoedaCompacta_(v){
  if(v>=1000)return "R$ "+(v/1000).toFixed(1).replace(".",",")+" mil";

// Gráfico de faturamento por dia da coleta, só do mês vigente — pedido do
// Alex pra enxergar em quais dias se concentra mais faturamento. Considera
// "faturado" os cards que já passaram por FATURADO ou FINALIZADO (o valor
// em aberto do card acima é o oposto disso, de propósito).
var _resumoChartW=320,_resumoChartH=150;
function montarGraficoResumo_(cards){
  var hoje=new Date(),ano=hoje.getFullYear(),mes=hoje.getMonth();
  var diasNoMes=new Date(ano,mes+1,0).getDate();
  var porDia=new Array(diasNoMes).fill(0);

  cards.forEach(function(c){
    if(c["Status"]!=="FATURADO"&&c["Status"]!=="FINALIZADO")return;
    var dc=c["DATA DA COLETA"];if(!dc)return;
    var p=String(dc).split("/");if(p.length!==3)return;
    var d=parseInt(p[0],10),m=parseInt(p[1],10)-1,y=parseInt(p[2],10);
    if(y!==ano||m!==mes||!d||d<1||d>diasNoMes)return;
    porDia[d-1]+=parseValorBR_(c["FRETE COBRADO"]);
  });

  var maxV=Math.max.apply(null,porDia.concat([0]));
  var padL=8,padR=8,padT=16,padB=20,W=_resumoChartW,H=_resumoChartH;
  var plotW=W-padL-padR,plotH=H-padT-padB;

  window._resumoChartPts=porDia.map(function(v,i){
    var x=padL+(diasNoMes>1?(i/(diasNoMes-1))*plotW:0);
    var y=padT+plotH-(maxV>0?(v/maxV)*plotH:0);
    return {dia:i+1,valor:v,x:x,y:y};
  });

  var linePath="M"+window._resumoChartPts.map(function(p){return p.x.toFixed(1)+","+p.y.toFixed(1);}).join(" L");
  var base=(padT+plotH).toFixed(1);
  var first=window._resumoChartPts[0],last=window._resumoChartPts[window._resumoChartPts.length-1];
  var areaPath=linePath+" L"+last.x.toFixed(1)+","+base+" L"+first.x.toFixed(1)+","+base+" Z";

  var diasEixo=[1,5,10,15,20,25,diasNoMes].filter(function(d,i,arr){return d<=diasNoMes&&arr.indexOf(d)===i;});
  var labelsX=diasEixo.map(function(d){
    var x=padL+(diasNoMes>1?((d-1)/(diasNoMes-1))*plotW:0);
    return "<text x=\""+x.toFixed(1)+"\" y=\""+(H-6)+"\" text-anchor=\"middle\" style=\"font-size:8px;fill:var(--txt-mid);font-family:'DM Sans',sans-serif\">"+d+"</text>";
  }).join("");

  return "<div class=\"resumo-chart\">"+
    "<div class=\"resumo-ttl\">Faturamento por dia da coleta <span style=\"font-weight:400;text-transform:none;letter-spacing:0\">— "+MESES_[mes]+"/"+ano+"</span></div>"+
    "<div style=\"position:relative;margin-top:10px\">"+
    "<svg viewBox=\"0 0 "+W+" "+H+"\" style=\"width:100%;height:150px;display:block\" onmousemove=\"hoverResumoChart_(event,this)\" onmouseleave=\"hideResumoChartTip_()\">"+
      "<line x1=\""+padL+"\" y1=\""+padT+"\" x2=\""+(W-padR)+"\" y2=\""+padT+"\" style=\"stroke:var(--border);stroke-width:1\"/>"+
      "<line x1=\""+padL+"\" y1=\""+base+"\" x2=\""+(W-padR)+"\" y2=\""+base+"\" style=\"stroke:var(--border);stroke-width:1\"/>"+
      (maxV>0?"<text x=\""+padL+"\" y=\""+(padT-4)+"\" style=\"font-size:8px;fill:var(--txt-mid);font-family:'DM Sans',sans-serif\">"+fmtMoedaCompacta_(maxV)+"</text>":"")+
      "<path d=\""+areaPath+"\" style=\"fill:var(--gold-dim);stroke:none\"/>"+
      "<path d=\""+linePath+"\" style=\"fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round\"/>"+
      "<circle cx=\""+last.x.toFixed(1)+"\" cy=\""+last.y.toFixed(1)+"\" r=\"4\" style=\"fill:var(--gold);stroke:var(--surface);stroke-width:2\"/>"+
      "<line id=\"resumo-chart-crosshair\" x1=\"0\" y1=\""+padT+"\" x2=\"0\" y2=\""+base+"\" style=\"stroke:var(--txt-mid);stroke-width:1;opacity:0\"/>"+
      "<circle id=\"resumo-chart-hoverdot\" r=\"4\" style=\"fill:var(--gold);stroke:var(--surface);stroke-width:2;opacity:0\"/>"+
      labelsX+
    "</svg>"+
    "<div class=\"resumo-chart-tip\" id=\"resumo-chart-tip\"></div>"+
    "</div></div>";
}
function hoverResumoChart_(ev,svg){
  var pts=window._resumoChartPts;
  if(!pts||!pts.length)return;
  var rect=svg.getBoundingClientRect();
  var mx=(ev.clientX-rect.left)*(_resumoChartW/rect.width);
  var nearest=pts[0],best=Infinity;
  pts.forEach(function(p){var d=Math.abs(p.x-mx);if(d<best){best=d;nearest=p;}});

  var cross=document.getElementById("resumo-chart-crosshair");
  var dot=document.getElementById("resumo-chart-hoverdot");
  var tip=document.getElementById("resumo-chart-tip");
  if(!cross||!dot||!tip)return;

  cross.setAttribute("x1",nearest.x);cross.setAttribute("x2",nearest.x);cross.style.opacity=1;
  dot.setAttribute("cx",nearest.x);dot.setAttribute("cy",nearest.y);dot.style.opacity=1;

  tip.style.display="block";
  tip.textContent="";
  var b=document.createElement("b");b.textContent=fmtMoeda_(nearest.valor);
  tip.appendChild(b);
  tip.appendChild(document.createTextNode(" · dia "+nearest.dia));
  var leftPx=(nearest.x/_resumoChartW)*rect.width;

function getFormData(){
  var dados={};
  // Campos sem input real no form — computados em saveCard
  var skipKeys={"Resumo":1,"Chave":1};
  Object.keys(FM).forEach(function(k){
    if(skipKeys[k])return;
    var elId=FM[k];
    // DT CODIGO e Chave compartilham o mesmo input fi_dt_codigo
    var el=document.getElementById(elId);
    if(!el)return;
    if(el.type==="date")dados[k]=fromDateInp(el.value);
    else dados[k]=el.value.trim();
    if(CAMPOS_MAIUSCULOS[k]&&dados[k])dados[k]=dados[k].toUpperCase();
  });
  // Garante fallback de custo
  if(!dados["CUSTO OPERACIONAL TOTAL"]&&dados["FRETE PAGO"])
    dados["CUSTO OPERACIONAL TOTAL"]=dados["FRETE PAGO"];
  var v=dados["VENDEDOR"];
  if(v&&vendedores.indexOf(v)===-1){vendedores.push(v);vendedores.sort();localStorage.setItem("vend_INF",JSON.stringify(vendedores));}
  return dados;
}

async function saveCard(){
  var btn=document.getElementById("btn-sv"),msg=document.getElementById("mmsg");
  var dados=getFormData();
  if(!dados["DT CODIGO"]){msg.textContent="DT Código obrigatório.";msg.className="mmsg err";return;}
  if(!dados["CLIENTE"]){msg.textContent="Cliente obrigatório.";msg.className="mmsg err";return;}
  if(!editKey&&!dados["VENDEDOR"]){msg.textContent="Vendedor obrigatório.";msg.className="mmsg err";return;}
  if(isUsed(dados["DT CODIGO"])){msg.textContent="Código já utilizado!";msg.className="mmsg err";return;}

  // Chave e Resumo (colunas A e B da planilha)
  dados["Chave"]=dados["DT CODIGO"];
  var parts=[dados["DT CODIGO"]];
  if(dados["CTE"])parts.push("CTE "+dados["CTE"]);
  if(dados["NF"])parts.push("NF "+dados["NF"]);
  if(dados["CLIENTE"])parts.push(dados["CLIENTE"]);
  var rota="";
  if(dados["CIDADE ORIGEM"])rota+=dados["CIDADE ORIGEM"]+(dados["UF ORIGEM"]?"/"+dados["UF ORIGEM"]:"");
  if(dados["CIDADE DESTINO"])rota+=(rota?" X ":"")+dados["CIDADE DESTINO"]+(dados["UF DESTINO"]?"/"+dados["UF DESTINO"]:"");
  if(rota)parts.push(rota);
  dados["Resumo"]=parts.join(" - ");

  btn.disabled=true;btn.innerHTML="<span class=\"spinner\"></span> Salvando…";msg.textContent="";
  try{
    var payload=mapearParaApi_(dados);
    var r;
    if(editKey){
      r=await apiFetch(API_BASE+"/kanban/"+encodeURIComponent(ABA)+"/"+encodeURIComponent(editKey),
        {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    }else{
      payload.empresa=ABA;
      r=await apiFetch(API_BASE+"/kanban",
        {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    }
    var resp=await r.json();
    if(!r.ok)throw new Error(resp.error||"Erro ao salvar");
    var ck=editKey||dados["DT CODIGO"];
    saveExtra(ck,dados);
    await saveAtt(ck);
    msg.textContent=editKey?"Atualizado!":"Card "+dados["DT CODIGO"]+" criado!";
    msg.className="mmsg";
    await loadData();
    setTimeout(closeModal,1100);
  }catch(ex){msg.textContent="Erro: "+ex.message;msg.className="mmsg err";}
  btn.disabled=false;btn.innerHTML="<i class=\"ti ti-device-floppy\" style=\"font-size:13px\"></i> Salvar";
}

async function deleteCard(){
  if(!editKey)return;
  if(!confirm("Excluir card "+editKey+"?"))return;
  var msg=document.getElementById("mmsg");
  try{
    var r=await apiFetch(API_BASE+"/kanban/"+encodeURIComponent(ABA)+"/"+encodeURIComponent(editKey),{method:"DELETE"});
    if(!r.ok){var j=await r.json();throw new Error(j.error||"Erro ao excluir");}
    // Anexos não são apagados sozinhos mais (antes isso acontecia junto da
    // exclusão da linha na planilha, via Apps Script) — remove cada um do
    // Drive manualmente, igual o botão de excluir anexo individual já fazia.
    for(var i=0;i<driveAtts.length;i++){
      try{ await fetchComTentativas_(WEBAPP_URL,{method:"POST",body:JSON.stringify({action:"excluir_anexo",fileId:driveAtts[i].id})}); }catch(e){}
    }
    // Limpa os dados extras guardados no navegador pra esse código — sem
    // isso, se esse mesmo código for reaproveitado por um card novo (a
    // numeração automática não sabe que esse código já foi usado e
    // excluído), os dados antigos apareceriam sozinhos no card novo.
    try{ localStorage.removeItem(EXTK+editKey); localStorage.removeItem("attcnt_"+editKey); }catch(e){}
    await loadData();closeModal();
  }catch(ex){msg.textContent="Erro: "+ex.message;msg.className="mmsg err";}
}




function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── ANEXOS VIA GOOGLE DRIVE ─────────────────────────────────

// carregandoAnexos/erroAnexos existem pra distinguir "ainda buscando",
// "deu erro" e "não tem anexo mesmo" — antes os três casos mostravam a
// mesma tela vazia, então uma falha (comum no Apps Script compartilhado
// pelos 4 quadros) parecia só "não tinha anexo", sem jeito de saber e
// sem botão pra tentar de novo.
var carregandoAnexos = false;
var erroAnexos = false;

function carregarAnexosDrive(chave) {
  if (!chave || !WEBAPP_URL) return;
  carregandoAnexos = true; erroAnexos = false; renderAttList();
  fetchComTentativas_(WEBAPP_URL + '?action=anexos&chave=' + encodeURIComponent(chave), null, 4, 15000)
    .then(function(j) {
      carregandoAnexos = false;
      if (j && j.success) {
        driveAtts = j.anexos || [];
        try { localStorage.setItem("attcnt_"+chave, JSON.stringify(driveAtts)); } catch(e) {}
      } else {
        erroAnexos = true;
      }
      renderAttList();
    }).catch(function() {
      carregandoAnexos = false; erroAnexos = true; renderAttList();
    });
}

function renderAttList() {
  var l = document.getElementById("att-list"); if (!l) return;
  if (carregandoAnexos) {
    l.innerHTML = "<div style=\"display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:12px;padding:8px 0\"><span class=\"spinner\" style=\"width:12px;height:12px;border-width:2px\"></span> Carregando anexos…</div>";
    var btnBaixarTudoL = document.getElementById("btn-baixar-tudo");
    if (btnBaixarTudoL) btnBaixarTudoL.style.display = "none";
    return;
  }
  var out = "";
  // Mostra anexos do Drive
  for (var i = 0; i < driveAtts.length; i++) {
    var a = driveAtts[i];
    var nm = a.nome || "arquivo";
    var sz = a.size > 1048576 ? (a.size/1048576).toFixed(1)+"MB" : a.size > 1024 ? (a.size/1024).toFixed(0)+"KB" : (a.size||0)+"B";
    var ico = /\.(jpg|jpeg|png|gif|webp)$/i.test(nm) ? "ti-photo" : /\.pdf$/i.test(nm) ? "ti-file-type-pdf" : "ti-file";
    out += "<div class=\"aitem\">"
         + "<i class=\"ti "+ico+"\" style=\"font-size:14px;color:var(--gold);flex-shrink:0\"></i>"
         + "<span class=\"aname\">" + e(nm) + "</span>"
         + "<span class=\"asz\">" + sz + "</span>"
         + "<a href=\"https://drive.google.com/file/d/"+a.id+"/view\" target=\"_blank\" class=\"adl\" style=\"color:#3B82F6\" rel=\"noopener\"><i class=\"ti ti-eye\"></i></a>"
         + "<a href=\""+a.url+"\" download=\""+e(nm)+"\" class=\"adl\"><i class=\"ti ti-download\"></i></a>"
         + "<button class=\"arm\" onclick=\"rmAttDrive('"+a.id+"',"+i+")\" title=\"Excluir\"><i class=\"ti ti-x\"></i></button>"
         + "</div>";
  }
  // Mostra novos arquivos ainda não enviados
  for (var i = 0; i < pendAtt.length; i++) {
    var a = pendAtt[i];
    var nm = a.name || "arquivo";
    var sz = a.size > 1048576 ? (a.size/1048576).toFixed(1)+"MB" : (a.size/1024).toFixed(0)+"KB";
    var ico = /^image\//i.test(a.type||"") ? "ti-photo" : a.type==="application/pdf" ? "ti-file-type-pdf" : "ti-file";
    out += "<div class=\"aitem\">"
         + "<i class=\"ti "+ico+"\" style=\"font-size:14px;color:#F59E0B;flex-shrink:0\"></i>"
         + "<span class=\"aname\">" + e(nm) + "</span>"
         + "<span class=\"asz\">" + sz + " <em style=\"color:#F59E0B\">(pendente)</em></span>"
         + "<button class=\"arm\" onclick=\"rmAtt("+i+")\" title=\"Remover\"><i class=\"ti ti-x\"></i></button>"
         + "</div>";
  }
  if (!out) {
    out = erroAnexos
      ? "<div style=\"display:flex;align-items:center;gap:10px;color:#EF4444;font-size:12px;padding:8px 0\">Erro ao carregar anexos.<button onclick=\"carregarAnexosDrive(editKey)\" style=\"background:none;border:1px solid #EF4444;color:#EF4444;padding:3px 9px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600\">Tentar de novo</button></div>"
      : "<div style=\"color:var(--text-muted);font-size:12px;padding:8px 0\">Nenhum anexo</div>";
  }
  l.innerHTML = out;
  var btnBaixarTudo = document.getElementById("btn-baixar-tudo");
  if (btnBaixarTudo) btnBaixarTudo.style.display = driveAtts.length ? "" : "none";
  // Bind clicks via addEventListener — resolve problemas com onclick inline em innerHTML
  var btns = l.querySelectorAll(".arm");
  btns.forEach(function(btn, n) {
    btn.onclick = null;
    btn.addEventListener("click", function(e) {
      e.stopPropagation();
      if (n < driveAtts.length) {
        // botao de anexo do Drive
        rmAttDrive(driveAtts[n].id, n);
      } else {
        // botao de arquivo pendente
        rmAtt(n - driveAtts.length);
      }
    });
  });
}

// Baixa todos os anexos do card de uma vez, num zip só. Tentativas
// anteriores (clicar em vários <a download> ou abrir várias abas) esbarram
// em duas limitações do navegador: o atributo "download" é ignorado em
// link de outro domínio (caso do Drive), e window.open() em sequência é
// bloqueado como pop-up a partir do segundo. A saída é o servidor buscar
// os arquivos e devolver um zip único — o navegador baixa isso numa blob:
// url, que é sempre "mesma origem", sem bloqueio nenhum.
async function baixarTodosAnexos() {
  if (!driveAtts.length) return;
  var btn = document.getElementById("btn-baixar-tudo");
  var orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = "<span class=\"spinner\"></span> Baixando...";
  try {
    var res = await apiFetch(API_BASE + "/kanban/anexos-zip", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        empresa: ABA,
        arquivos: driveAtts.map(function(a) { return { id: a.id, nome: a.nome }; }),
      }),
    });
    if (!res.ok) {
      var j = await res.json().catch(function() { return {}; });
      alert("Erro ao gerar o zip. " + (j.error || ""));
      return;
    }
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "anexos_" + (editKey || "card") + ".zip";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert("Erro de conexão ao gerar o zip.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

function getAtt(key) {
  // Lê contagem cacheada por card (salva após carregarAnexosDrive)

function handleFiles(files) {
  console.log("[handleFiles] arquivos selecionados:", files.length);
  Array.prototype.forEach.call(files, function(f) {
    if (f.size > 10*1048576) { alert("Arquivo " + f.name + " excede 10MB."); return; }
    console.log("[handleFiles] adicionando:", f.name, f.size, f.type);
    pendAtt.push(f);
    renderAttList();
  });
  console.log("[handleFiles] pendAtt total:", pendAtt.length);
}

function rmAtt(i) { pendAtt.splice(i, 1); renderAttList(); }

function rmAttDrive(fileId, i) {
  console.log("[rmAttDrive] Iniciando exclusão de", fileId);
  if (!confirm("Excluir este anexo permanentemente?")) return;
  if (!WEBAPP_URL || !fileId) { 
    alert("Erro: URL ou fileId ausente");
    console.error("[rmAttDrive] Validação falhou - WEBAPP_URL:", WEBAPP_URL, "fileId:", fileId);
    return; 
  }
  console.log("[rmAttDrive] Enviando requisição DELETE para Apps Script");
  fetchComTentativas_(WEBAPP_URL, {
    method: "POST",
    body: JSON.stringify({ action: "excluir_anexo", fileId: fileId })
  })
  .then(function(j) {
    console.log("[rmAttDrive] JSON recebido:", j);
    if (j.success) {
      console.log("[rmAttDrive] ✓ Sucesso! Removendo da lista...");
      driveAtts.splice(i, 1);
      try { localStorage.setItem("attcnt_"+editKey, JSON.stringify(driveAtts)); } catch(e) {}
      renderAttList();
      alert("✓ Anexo excluído com sucesso!");
    } else {
      console.error("[rmAttDrive] ✗ Erro:", j);
      alert("Erro ao excluir: " + (j.error || JSON.stringify(j)));
    }
  })
  .catch(function(err) {
    console.error("[rmAttDrive] ✗ Erro na requisição:", err);
    alert("Erro ao excluir anexo: " + err.message);
  });
}

async function saveAtt(key) {
  console.log("[saveAtt] chamado com key:", key, "pendAtt:", pendAtt.length);
  if (!pendAtt.length) { console.log("[saveAtt] nenhum pendente, pulando"); return; }
  if (!key) { console.error("[saveAtt] chave vazia — upload cancelado"); return; }
  var btn = document.getElementById("btn-sv");
  var orig = btn ? btn.innerHTML : "";
  var total = pendAtt.length;
  var erros = [];

  // Envia sequencialmente — Apps Script não suporta chamadas paralelas
  for (var i = 0; i < pendAtt.length; i++) {
    var f = pendAtt[i];
    if (btn) btn.innerHTML = "<span class=\"spinner\"></span> Enviando anexo " + (i + 1) + "/" + total + "…";
    try {
      var base64 = await new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function(ev) { resolve(ev.target.result.split(",")[1]); };
        reader.onerror = function() { reject(new Error("Falha ao ler " + f.name)); };
        reader.readAsDataURL(f);
      });
      var j = await fetchComTentativas_(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "upload_anexo",
          chave: key,
          nome: f.name,
          data: base64,
          mimeType: f.type || "application/octet-stream"
        })
      });
      console.log('[saveAtt] resposta Drive:', JSON.stringify(j));
      if (j.success && j.anexo) { driveAtts.push(j.anexo);
        try { localStorage.setItem("attcnt_"+key, JSON.stringify(driveAtts)); } catch(e) {} }
      else { console.error('[saveAtt] erro:', j.error); erros.push(f.name); }
    } catch(err) {
      console.error('[saveAtt] erro:', err);
      erros.push(f.name);
    }
    renderAttList();
  }

  pendAtt = [];
  if (btn) btn.innerHTML = orig;
  renderAttList();
  if (erros.length) alert("⚠ Falha ao enviar " + erros.length + " anexo(s): " + erros.join(", "));
}

async function ddrop(ev,status){
  ev.preventDefault();ev.currentTarget.classList.remove("dov");
  var key=ev.dataTransfer.getData("text/plain");if(!key)return;
  var card=null;
  for(var i=0;i<allCards.length;i++){if((allCards[i]["DT CODIGO"]||allCards[i]["Chave"])===key){card=allCards[i];break;}}
  if(!card)return;
  var statusAnterior=card["Status"];
  card["Status"]=status;
  renderBoard(); // feedback visual imediato, otimista
  try{
    var r=await apiFetch(API_BASE+"/kanban/"+encodeURIComponent(ABA)+"/"+encodeURIComponent(key),
      {method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(mapearParaApi_(card))});
    var j=await r.json();
    if(!r.ok){
      card["Status"]=statusAnterior; // desfaz o movimento visual — não salvou de verdade
      renderBoard();
      alert("Não foi possível mover o card agora ("+(j&&j.error?j.error:"tente novamente")+"). O card voltou pra coluna original.");
    }
  }catch(ex){
    console.warn("Erro ao mover card:",ex);
    card["Status"]=statusAnterior;
    renderBoard();
    alert("Não foi possível mover o card agora. O card voltou pra coluna original — tente de novo.");
  }
}

// ── CÓDIGO AUTOMÁTICO
// ── GERAÇÃO DE CÓDIGO
// Formato: [PFX][AA][M][NN]
//   PFX = letra da empresa (P, B, G, S)
//   AA  = ano vigente com 2 dígitos (ex: 26)
//   M   = mês sem zero à esquerda (1-12)
//   NN  = sequência do card no mês, 2 dígitos, começa em 01 e zera todo mês
function genCod(){
  var d=new Date();
  var yy=String(d.getFullYear()).slice(2);   // "26"
  var m=String(d.getMonth()+1);             // "5" (sem zero)
  var prefix=PFX+yy+m;                      // ex: "P265"

  // Filtra cards do mês atual com mesmo prefixo para achar a maior sequência
  var re=new RegExp("^"+prefix+"(\\d{2})$");
  var maxSeq=0;
  allCards.forEach(function(c){
    var cod=(c["DT CODIGO"]||c["Chave"]||"");
    var match=cod.match(re);
    if(match){
      var n=parseInt(match[1],10);
      if(n>maxSeq)maxSeq=n;
    }
  });
  var nextSeq=String(maxSeq+1).padStart(2,"0");
  return prefix+nextSeq;
}
function isUsed(cod){
  if(!cod||editKey===cod)return false;
  for(var i=0;i<allCards.length;i++){if((allCards[i]["DT CODIGO"]||allCards[i]["Chave"])===cod)return true;}
  return false;
}
function checkCod(val){
  var ok=document.getElementById("cod-ok");

  var inp=document.getElementById("fi_dt_codigo");

  // Bloqueia o botão Salvar se código duplicado
  var btn=document.getElementById("btn-sv");
  if(btn)btn.disabled=used;
}

// ── IMPORTAR DADOS DE CARD EXISTENTE
function importarCard(){
  var msgEl=document.getElementById("import-msg");
  var codInp=document.getElementById("fi_import_cod");
  var cod=(codInp?codInp.value:"").trim();
  if(!cod){
    if(msgEl){msgEl.textContent="Informe o código do card.";msgEl.style.color="var(--red)";}
    return;
  }
  // Procura o card pelo DT CODIGO / Chave / código no Resumo
  var found=null;
  for(var i=0;i<allCards.length;i++){
    var c2=allCards[i];
    var c2cod=String(c2["DT CODIGO"]||c2["Chave"]||"").trim();
    var c2resumoCod=(c2["Resumo"]||"").split(" - ")[0].trim();
    if(c2cod.toUpperCase()===cod.toUpperCase()||c2resumoCod.toUpperCase()===cod.toUpperCase()){found=c2;break;}
  }
  if(!found){
    if(msgEl){msgEl.textContent="Card '"+cod+"' não encontrado.";msgEl.style.color="var(--red)";}
    return;
  }
  // Campos que NÃO devem ser copiados:
  // identificação própria, todas as datas, e toda a seção Fiscal (CTE/NF)
  var skipFields={
    "DT CODIGO":1,"Chave":1,"Resumo":1,"Status":1,"ACOMPANHAMENTO":1,"TITULO":1,
    "DATA DA COLETA":1,"PREVISÃO DE ENTREGA":1,"DATA DA ENTREGA":1,
    "CTE":1,"NF":1
  };
  var aliases={
    "FRETE CLIENTE":"FRETE COBRADO","FRETE MOTORISTA":"FRETE PAGO",
    "CUSTO TOTAL OPERACIONAL":"CUSTO OPERACIONAL TOTAL",
    "PREVISAO DA ENTREGA":"PREVISÃO DE ENTREGA","PREVISAO DE ENTREGA":"PREVISÃO DE ENTREGA",
    "CUSTO OPERACIONAL":"CUSTO OPERACIONAL TOTAL"
  };
  var copiedCount=0;
  Object.keys(FM).forEach(function(k){
    if(skipFields[k])return;
    var origemKey=k;
    var val=found[origemKey];
    if(val==null||val===""){
      // tenta via alias reverso
      Object.keys(aliases).forEach(function(a){ if(aliases[a]===k&&found[a]) val=found[a]; });
    }
    if(val==null||val==="")return;
    fset(k,val);
    copiedCount++;
  });
  // Anexos do Drive do card de origem (mesma lógica do carregarAnexosDrive)
  if(found["DT CODIGO"]||found["Chave"]){
    var origemChave=found["DT CODIGO"]||found["Chave"];
    if(WEBAPP_URL){
      fetchComTentativas_(WEBAPP_URL+'?action=anexos&chave='+encodeURIComponent(origemChave))
        .then(function(j){
          if(j.success){
            driveAtts=(j.anexos||[]).slice();
            renderAttList();
          }
        }).catch(function(){});
    }
  }
  if(msgEl){
    msgEl.textContent="✓ "+copiedCount+" campos importados de '"+cod+"' (datas e identificação mantidas em branco).";
    msgEl.style.color="var(--green)";
  }
}
